<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Architex - The Future of Design</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'eco-green': '#10B981',
              'pi-gold': '#FDB300',
              'ai-violet': '#8B5CF6',
              'brand-dark': '#020617',
            },
            boxShadow: {
              'glow-violet': '0 0 20px 5px rgba(139, 92, 246, 0.3)',
              'glow-green': '0 0 20px 5px rgba(16, 185, 129, 0.3)',
            }
          }
        }
      }
    </script>
    <style>
      /* Utility to hide scrollbar for Chrome, Safari and Opera */
      .no-scrollbar::-webkit-scrollbar {
          display: none;
      }
      /* Utility to hide scrollbar for IE, Edge and Firefox */
      .no-scrollbar {
          -ms-overflow-style: none;  /* IE and Edge */
          scrollbar-width: none;  /* Firefox */
      }
    </style>
    <script src="https://sdk.pi-network.dev/v2/pi-sdk.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function() {
        try {
          if (window.Pi) {
            window.Pi.init({ version: "2.0", sandbox: true });
            console.log("Pi SDK Initialized successfully.");
          } else {
            console.warn("Pi SDK not found on window object.");
          }
        } catch (e) {
          console.error("Error initializing Pi SDK:", e);
        }
      });
    </script>
  <script type="importmap">
{
  "imports": {
    "vite": "https://aistudiocdn.com/vite@^7.2.2",
    "@vitejs/plugin-react": "https://aistudiocdn.com/@vitejs/plugin-react@^5.1.1",

    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",
    "zustand": "https://aistudiocdn.com/zustand@^5.0.8"
  }
}
</script>
