<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Architex - The Future of Design</title>
    
    <!-- Fonts: Outfit (UI) and Space Grotesk (Data/Numbers) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Outfit', 'sans-serif'],
              mono: ['Space Grotesk', 'monospace'],
            },
            colors: {
              'eco-green': '#10B981',
              'pi-gold': '#FDB300',
              'ai-violet': '#8B5CF6',
              'brand-dark': '#030712', 
              'brand-surface': '#0F172A',
            },
            boxShadow: {
              'glow-violet': '0 0 40px -10px rgba(139, 92, 246, 0.5)',
              'glow-gold': '0 0 40px -10px rgba(253, 179, 0, 0.5)',
              'glow-green': '0 0 40px -10px rgba(16, 185, 129, 0.5)',
              'glass': '0 8px 32px 0 rgba(0, 0, 0, 0.37)',
              'inner-light': 'inset 0 1px 0 0 rgba(255, 255, 255, 0.1)',
            },
            animation: {
              'blob': 'blob 20s infinite alternate',
              'float': 'float 6s ease-in-out infinite',
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'fade-in': 'fadeIn 0.6s ease-out',
              'slide-up': 'slideUp 0.5s ease-out',
              'shimmer': 'shimmer 2s linear infinite',
            },
            keyframes: {
              blob: {
                '0%': { transform: 'translate(0px, 0px) scale(1)' },
                '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                '100%': { transform: 'translate(0px, 0px) scale(1)' },
              },
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-10px)' },
              },
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              slideUp: {
                '0%': { transform: 'translateY(20px)', opacity: '0' },
                '100%': { transform: 'translateY(0)', opacity: '1' },
              },
              shimmer: {
                '0%': { backgroundPosition: '200% 0' },
                '100%': { backgroundPosition: '-200% 0' }
              }
            }
          }
        }
      }
    </script>
    <style>
      /* Base Styles */
      body {
        background-color: #030712;
        color: #F8FAFC;
        font-family: 'Outfit', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overscroll-behavior-y: none; /* Prevent pull-to-refresh on mobile */
        padding-bottom: env(safe-area-inset-bottom); /* iOS Safety */
      }

      /* Scrollbar Hiding */
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      /* Safe Area Handling utilities */
      .pb-safe {
        padding-bottom: env(safe-area-inset-bottom);
      }
      .pt-safe {
        padding-top: env(safe-area-inset-top);
      }
      .mb-safe {
        margin-bottom: env(safe-area-inset-bottom);
      }

      /* Cinematic Noise Texture */
      .bg-noise {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 0;
        opacity: 0.05;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      }
    </style>
    <script src="https://sdk.pi-network.dev/v2/pi-sdk.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function() {
        try {
          if (window.Pi) {
            window.Pi.init({ version: "2.0", sandbox: true });
            console.log("Pi SDK Initialized successfully.");
          }
        } catch (e) {
          console.error("Error initializing Pi SDK:", e);
        }
      });
    </script>
  <script type="importmap">
{
  "imports": {
    "vite": "https://aistudiocdn.com/vite@^7.2.2",
    "@vitejs/plugin-react": "https://aistudiocdn.com/@vitejs/plugin-react@^5.1.1",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react-dom": "https://aistudiocdn.com/react-dom@^19.2.0",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",
    "zustand": "https://aistudiocdn.com/zustand@^5.0.8",
    "framer-motion": "https://aistudiocdn.com/framer-motion@^11.0.8",
    "three": "https://aistudiocdn.com/three@0.160.0",
    "@react-three/fiber": "https://aistudiocdn.com/@react-three/fiber@8.15.12",
    "@react-three/drei": "https://aistudiocdn.com/@react-three/drei@9.99.0"
  }
}
</script>
</head>
  <body class="bg-brand-dark selection:bg-pi-gold selection:text-brand-dark overflow-hidden">
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
