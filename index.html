<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Architex - The Future of Design</title>
    
    <!-- Fonts: Outfit (UI) and Space Grotesk (Data/Numbers) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://sdk.pi-network.dev/v2/pi-sdk.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function() {
        try {
          if (window.Pi) {
            window.Pi.init({ version: "2.0", sandbox: true });
            console.log("Pi SDK Initialized successfully.");
          }
        } catch (e) {
          console.error("Error initializing Pi SDK:", e);
        }
      });
    </script>
</head>
  <body class="bg-brand-dark selection:bg-pi-gold selection:text-brand-dark overflow-hidden">
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
